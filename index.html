<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#F1F1EF" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>lowkkey 训练展厅</title>
    <style>
      #file-help[hidden] { display: none; }
      #file-help { min-height: 100vh; box-sizing: border-box; padding: 9vh 24px; background: #f2f2f4; color: #141518; font: 14px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #file-help > div { max-width: 480px; margin: auto; background: white; border-radius: 18px; padding: 28px; }
      #file-help h1 { margin: 0 0 12px; font-size: 26px; line-height: 1.3; }
      #file-help p { margin: 0 0 14px; color: #666870; }
      #file-help code { display: block; padding: 12px; border-radius: 9px; background: #f2f2f4; color: #141518; overflow-wrap: anywhere; }
      #file-help a { color: #234b7b; }
      @media (prefers-color-scheme: dark) { #file-help { background: #1d1f23; color: #f3f3f4; } #file-help > div { background: #2a2d32; } #file-help p { color: #b3b5bd; } #file-help code { background: #1d1f23; color: #f3f3f4; } #file-help a { color: #a9cafa; } }
    </style>
  </head>
  <body>
    <div id="file-help" hidden>
      <div>
        <h1>请从本地服务打开 lowkkey</h1>
        <p>训练展厅需要本地 API 和数据库。直接双击这个 HTML 文件无法运行应用。</p>
        <p>在项目目录的终端运行：</p>
        <code>./scripts/run dev</code>
        <p>然后打开 <a href="http://127.0.0.1:5173">http://127.0.0.1:5173</a>。</p>
      </div>
    </div>
    <div id="root"></div>
    <script>if (location.protocol === 'file:') document.getElementById('file-help').hidden = false;</script>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
