<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>lowkkey 独立演练</title>
<style>*{box-sizing:border-box}body{margin:0;background:#E9E9E7;color:#141415;font:14px -apple-system,sans-serif}header{max-width:960px;margin:auto;padding:20px}h1{font-size:20px}p{line-height:1.8;color:#6C6C71}button{padding:12px 16px;margin:4px;border:1px solid #D5D5D3;border-radius:24px;background:#F7F7F5;color:#141415;font:inherit;cursor:pointer}iframe{display:block;width:min(960px,100%);height:85vh;margin:auto;border:1px solid #D5D5D3;background:#F1F1EF}#message{min-height:25px}</style>
<header><h1>独立演练 · 测试数据</h1><p>这是本地模拟客户端，未连接真实 AI。数据来自独立临时库，与个人记录分开。</p>
<button data-action="plan">模拟 AI 更新计划</button><button data-action="session">模拟 AI 保存训练</button><button data-action="weight">模拟 AI 保存体重</button><button data-action="brief">读取简报</button><button data-action="reset">重置演练</button><p id="message" role="status"></p></header><iframe title="lowkkey 三屏展厅"></iframe>
<script>
let app; const frame=document.querySelector('iframe'), message=document.querySelector('#message');
async function refreshFrame(){const r=await fetch('/status');const value=await r.json();app=value.app;frame.src=app;}
document.querySelectorAll('button').forEach(button=>button.onclick=async()=>{document.querySelectorAll('button').forEach(b=>b.disabled=true);try{const r=await fetch('/action/'+button.dataset.action,{method:'POST'});const value=await r.json();message.textContent=value.message||value.error;if(r.ok)await refreshFrame();}catch{message.textContent='操作未完成，请重试。';}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);}});
refreshFrame();
</script></html>
