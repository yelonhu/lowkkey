<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px system-ui;margin:0;padding:24px;background:#f1f1ef;color:#141415}h1{font-size:22px}button{font:inherit;border:0;border-radius:24px;padding:12px 20px;margin:8px 8px 0 0;background:#141415;color:white}pre{white-space:pre-wrap;overflow-wrap:anywhere}p{line-height:1.6}button:active{scale:.97}button:disabled{opacity:.4}</style><h1>lowkkey</h1><p id="state">正在读取提案…</p><details><summary>查看详情</summary><pre id="details"></pre></details><button id="review" disabled>查看并确认</button><button id="refresh" disabled>刷新结果</button><p id="notice">未确认内容不会进入记录。确认将在 lowkkey 中完成。</p><script>
let serial=0,current=null,hostOrigin='*';const pending=new Map();
function send(method,params={}){const id=++serial;parent.postMessage({jsonrpc:'2.0',id,method,params},hostOrigin);return new Promise((resolve,reject)=>{const timeout=setTimeout(()=>{pending.delete(id);reject(new Error('timeout'));},15000);pending.set(id,{resolve,reject,timeout});});}
function show(result){const data=result?.structuredContent?.result??result?.result;if(!data)return;current=data;document.getElementById('state').textContent=data.title??data.item?.title??'提案详情';const statuses={pending:'等待确认',open:'等待确认',accepted:'已采用',skipped:'已跳过',rejected:'未采用'};document.getElementById('notice').textContent=statuses[data.status]??'请查看当前状态';const names=new Map((data.exercises??[]).map(ex=>[ex.id,ex.name]));const days=data.item?.patch?.days;document.getElementById('details').textContent=days?days.map(day=>`${day.name}\n${day.items.map(item=>`${names.get(item.exerciseId)??(data.item.exercises??[]).find(ex=>ex.id===item.exerciseId)?.name??item.exerciseId} · ${item.sets} 组 × ${item.repMin}–${item.repMax} 次`).join('\n')}`).join('\n\n'):(data.drafts??[]).map(d=>`${d.corrects?'更正记录 · ':''}${d.date} · ${d.kind==='weight'?`体重 ${d.raw.value} ${d.raw.unit}`:d.kind==='set'?`${names.get(d.exerciseId)??d.exerciseId} ${d.load} ${d.unit} × ${d.reps}`:d.kind==='waist'?`腰围 ${d.cm} cm`:d.kind==='note'?d.text:'调整训练组类别'}`).join('\n')||data.item?.rationale||'请在 lowkkey 查看完整变化';document.getElementById('review').disabled=!data.reviewUrl;document.getElementById('refresh').disabled=false;}
window.addEventListener('message',event=>{if(event.source!==parent||!event.data||event.data.jsonrpc!=='2.0')return;if(hostOrigin!=='*'&&event.origin!==hostOrigin)return;if(event.origin!=='null')hostOrigin=event.origin;const msg=event.data,task=pending.get(msg.id);if(task){clearTimeout(task.timeout);pending.delete(msg.id);msg.error?task.reject(new Error('host_error')):task.resolve(msg.result);}if(msg.method==='ui/notifications/tool-result')show(msg.params);});
document.getElementById('refresh').onclick=()=>send('tools/call',{name:'get_review',arguments:{kind:current.kind,id:current.id}}).then(show).catch(()=>document.getElementById('notice').textContent='暂时无法刷新，请重试。');
document.getElementById('review').onclick=()=>{try{const url=new URL(current.reviewUrl);if(url.protocol!=='https:'&&url.hostname!=='127.0.0.1')return;send('ui/open-link',{url:url.href}).catch(()=>document.getElementById('notice').textContent='请使用对话中的审阅链接。');}catch{}};
send('ui/initialize',{appInfo:{name:'lowkkey',version:'1.0.0'},appCapabilities:{},protocolVersion:'2026-01-26'}).then(()=>parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},hostOrigin)).catch(()=>document.getElementById('state').textContent='请使用对话中的审阅链接打开 lowkkey。');
</script></html>
